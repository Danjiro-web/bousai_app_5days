{% extends "base.html" %}

{% block content %}
<style>
  .page-shell {
    max-width: 980px;
    margin: 0 auto;
  }

  .card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    box-shadow: 0 2px 0 rgba(33, 53, 70, 0.05);
  }

  .map-card {
    position: relative;
    z-index: 0;
    padding: 22px 20px 14px;
  }

  .section-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    color: #1d4769;
  }

  .section-head h2 {
    margin: 0;
    font-size: 2.1rem;
    line-height: 1.2;
    letter-spacing: 0.02em;
    font-weight: 800;
  }

  .marker-icon {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #1b4d82;
    flex-shrink: 0;
  }

  .map-wrap {
    height: 446px;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(120, 146, 165, 0.35);
    background: #dfeff4;
  }

  #shelterMap {
    width: 100%;
    height: 100%;
  }

  .weather-card {
    position: relative;
    z-index: 1;
    margin-top: 24px;
    padding: 18px 20px 16px;
  }

  .weather-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(94, 123, 146, 0.25);
  }

  .weather-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #1d4769;
  }

  .weather-title h2 {
    margin: 0;
    font-size: 2.1rem;
    line-height: 1.2;
    letter-spacing: 0.02em;
    font-weight: 800;
  }

  .weather-icon {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #1b4d82;
    flex-shrink: 0;
  }

  .refresh-button {
    border: 0;
    border-radius: 999px;
    background: rgba(37, 180, 120, 0.12);
    color: var(--button-green-dark);
    font-weight: 700;
    font-size: 1.05rem;
    padding: 8px 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  .refresh-button .sync-icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .weather-body {
    padding-top: 18px;
  }

  .weather-content {
    min-height: 128px;
  }

  .weather-content .location-line {
    margin: 0 0 12px;
    font-size: 1.1rem;
    font-weight: 700;
    color: #1d4769;
  }

  .weather-content .status-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 0 0 10px;
    color: var(--button-green-dark);
    font-weight: 700;
    font-size: 1.05rem;
  }

  .weather-content .status-row .check {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--success);
    flex-shrink: 0;
  }

  .weather-content .meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0 0 8px;
    color: #516575;
    font-size: 1rem;
  }

  .weather-content .meta-row .icon {
    width: 18px;
    height: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #607788;
    flex-shrink: 0;
  }

  .weather-content .meta-row strong {
    color: #1d4769;
    font-weight: 700;
  }

  .weather-content ul {
    margin: 0 0 12px;
    padding-left: 26px;
    color: #1d4769;
  }

  .weather-content li {
    margin-bottom: 4px;
    list-style: disc;
  }

  @media (max-width: 768px) {
    .topbar h1 {
      font-size: 1.8rem;
    }

    .weather-header {
      flex-direction: column;
      align-items: flex-start;
    }

    .weather-title h2, .section-head h2 {
      font-size: 1.5rem;
    }

    .map-wrap {
      height: 320px;
    }
  }
</style>

<div class="page-shell">
  <section class="card map-card">
    <div class="section-head">
      <span class="marker-icon" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 21C15.5 17.4 18 14.6 18 11C18 7.68629 15.3137 5 12 5C8.68629 5 6 7.68629 6 11C6 14.6 8.5 17.4 12 21Z" stroke="currentColor" stroke-width="1.8" fill="none"/>
          <circle cx="12" cy="11" r="2.5" stroke="currentColor" stroke-width="1.8" fill="none"/>
        </svg>
      </span>
      <h2>避難所マップ</h2>
    </div>
    <div class="map-wrap">
      <div id="shelterMap"></div>
    </div>
  </section>

  <section class="card weather-card">
    <div class="weather-header">
      <div class="weather-title">
        <span class="weather-icon" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 16.5C4.79086 16.5 3 14.7091 3 12.5C3 10.5681 4.33392 8.99575 6.17038 8.71748C6.74489 6.77953 8.53457 5.5 10.6 5.5C13.3365 5.5 15.6148 7.47973 15.9306 10.1184C17.3067 10.2197 18.5 11.4315 18.5 12.9C18.5 14.4534 17.2344 15.7 15.7 15.7H7Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <h2 id="weatherTitle">青森市 気象警報・注意報</h2>
      </div>
      <button class="refresh-button" id="refreshWeather" type="button">
        <span class="sync-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 12C20 16.4183 16.4183 20 12 20C7.58172 20 4 16.4183 4 12C4 9.88431 4.82684 7.9264 6.21468 6.48047M4 4V8H8M4 12C4 7.58172 7.58172 4 12 4C16.4183 4 20 7.58172 20 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        10分おき自動更新
      </button>
    </div>
    <div class="weather-body">
      <div id="weatherContent" class="weather-content">
        <p>読み込み中...</p>
      </div>
    </div>
  </section>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap').setView([35.3390, 139.4903], 12);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const weatherContent = document.getElementById('weatherContent');
    const weatherTitle = document.getElementById('weatherTitle');
    const refreshButton = document.getElementById('refreshWeather');

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            });
    }

    function updateWeatherContent(data) {
        const areaName = data.area_name || '青森市';
        weatherTitle.textContent = `${areaName} 気象警報・注意報`;

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<ul>';
            data.warnings.forEach(warning => {
                warningsHtml += `<li>${warning.name}（${warning.status}）</li>`;
            });
            warningsHtml += '</ul>';
        } else {
            warningsHtml = `
                <p class="status-row">
                    <span class="check" aria-hidden="true">✓</span>
                    <span>現在、警報・注意報は発表されていません</span>
                </p>
            `;
        }

        weatherContent.innerHTML = `
            <p class="location-line">${areaName}</p>
            ${warningsHtml}
            <p class="meta-row">
                <span class="icon" aria-hidden="true">◔</span>
                <span>データ取得時刻: <strong>${data.last_fetch_time || '更新中...'}</strong></span>
            </p>
            <p class="meta-row">
                <span class="icon" aria-hidden="true">◌</span>
                <span>気象庁最終発表: <strong>${data.report_time || '不明'}</strong></span>
            </p>
        `;
    }

    refreshButton.addEventListener('click', updateWeatherWarnings);

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
