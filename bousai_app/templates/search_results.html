{% extends "base.html" %}

{% block content %}
<style>
  .search-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  .search-header h2 {
    margin: 0;
  }

  .search-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .refresh-time {
    font-size: 0.95rem;
    color: #4f5f6b;
    white-space: nowrap;
  }

  .refresh-button {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid #0b4d82;
    background: #0b4d82;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
  }
</style>

<div class="search-header">
  <h2>検索結果</h2>

  <div class="search-actions">
    <span class="refresh-time">更新日時: {{ refreshed_at or '取得中...' }}</span>
    <a class="refresh-button" href="/all_shelters">最新情報に更新</a>
  </div>
</div>

{% if results %}
  <ul>
    {% for shelter in results %}
    <li>{{ shelter.name }}</li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a href="/shelter_search">検索画面に戻る</a> |
  <a href="/">トップページへ戻る</a>
</p>
{% endblock %}
